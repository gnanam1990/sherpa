<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <title>Sherpa</title>
  <desc>Sherpa horizontal logo lockup with wordmark</desc>
  <defs>
    <clipPath id="hlClip">
      <rect x="20" y="20" width="160" height="160" rx="36"/>
    </clipPath>
  </defs>
  <!-- Icon -->
  <rect x="20" y="20" width="160" height="160" rx="36" fill="#0052FF"/>
  <g clip-path="url(#hlClip)">
    <polygon points="20,156 84,60 148,128 180,96 180,180 20,180" fill="#1F6BFF"/>
    <polygon points="44,180 108,68 180,156 180,180" fill="#FFFFFF"/>
    <path d="M 68 158
             Q 96 154 104 142
             Q 112 130 100 120
             Q 88 110 100 99
             Q 112 88 132 96
             Q 148 102 148 114"
          fill="none" stroke="#0052FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="108" cy="68" r="5" fill="#FFFFFF" stroke="#0052FF" stroke-width="2.5"/>
  </g>

  <!-- Wordmark -->
  <text x="210" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="78" font-weight="500" fill="#0052FF">sherpa</text>
  <text x="214" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#6B7785">the natural-language Base agent</text>
</svg>
