name: Lighthouse

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'packages/identity/**'
      - 'packages/logger/**'
      - 'packages/memory/**'
      - 'packages/config/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/lighthouse.yml'

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4.4.0
        with:
          version: 9.15.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @sherpa/ui --filter @sherpa/core --filter @sherpa/logger --filter @sherpa/config --filter @sherpa/memory build

      - name: Build web
        run: pnpm --filter @sherpa/web build
        env:
          NEXT_PUBLIC_WC_PROJECT_ID: lighthouse-ci
          NEXT_PUBLIC_CDP_PROJECT_ID: lighthouse-ci

      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.x autorun --config=./apps/web/lighthouserc.json
