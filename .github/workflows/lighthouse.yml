name: Lighthouse

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'packages/identity/**'
      - 'packages/logger/**'
      - 'packages/memory/**'
      - 'packages/config/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/lighthouse.yml'

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4.4.0
        with:
          version: 9.15.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @sherpa/ui --filter @sherpa/core --filter @sherpa/logger --filter @sherpa/config --filter @sherpa/memory build

      - name: Build web
        run: pnpm --filter @sherpa/web build

      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.x autorun --config=./apps/web/lighthouserc.json
