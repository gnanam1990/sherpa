name: Lighthouse

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - '.github/workflows/lighthouse.yml'

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter @sherpa/ui --filter @sherpa/core --filter @sherpa/logger --filter @sherpa/config --filter @sherpa/memory build

      - name: Build web
        run: pnpm --filter @sherpa/web build
        env:
          NEXT_PUBLIC_WC_PROJECT_ID: lighthouse-ci
          NEXT_PUBLIC_CDP_PROJECT_ID: lighthouse-ci

      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.x autorun --config=./apps/web/lighthouserc.json
